name: kyc-lga-crawler-pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

jobs:
  build-and-crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t kyc-lga-crawler .

      - name: Run crawler
        run: docker run --rm -v ${{ github.workspace }}:/app kyc-lga-crawler

      - name: Upload data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kyc-lga-output
          path: |
            kyc_lga_all_data.json
            kyc_lga_backup.pkl
            crawler.log
